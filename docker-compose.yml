services:
  db:
    image: postgres:16-alpine
    container_name: ai-travel-db
    environment:
      POSTGRES_DB: ai_travel
      POSTGRES_USER: ai_travel
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ai_travel_password}
    volumes:
      - app_db_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_travel -d ai_travel"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: ai-travel-backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DATABASE_URL: postgresql+psycopg://ai_travel:${DB_PASSWORD:-ai_travel_password}@db:5432/ai_travel
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-local-dev-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_DOCUMENT_BUCKET: ${S3_DOCUMENT_BUCKET:-}
      S3_DOCUMENT_KMS_KEY_ID: ${S3_DOCUMENT_KMS_KEY_ID:-}
      S3_PRESIGNED_URL_EXPIRES_SECONDS: ${S3_PRESIGNED_URL_EXPIRES_SECONDS:-900}
      S3_MAX_UPLOAD_BYTES: ${S3_MAX_UPLOAD_BYTES:-10485760}
      S3_ALLOWED_CONTENT_TYPES: ${S3_ALLOWED_CONTENT_TYPES:-application/pdf,image/jpeg,image/png,image/webp,text/plain,text/markdown,application/json,text/csv}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ~/.aws:/home/app/.aws:ro
    ports:
      - "8080:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: ai-travel-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app_db_data:
